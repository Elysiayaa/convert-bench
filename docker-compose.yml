services:
  backend:
    build:
      context: ./backend
    container_name: convertbench-backend
    environment:
      APP_ENV: production
      DATABASE_URL: sqlite:////app/data/convertbench.db
      STORAGE_ROOT: /app/storage
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-3000}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # Persist SQLite and uploaded files / 持久化数据库与上传文件
      - ./backend/data:/app/data
      - ./backend/storage:/app/storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Browser-visible URL / 浏览器访问后端所使用的地址
        NEXT_PUBLIC_API_BASE_URL: http://localhost:${BACKEND_PORT:-8000}
    container_name: convertbench-frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${BACKEND_PORT:-8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

